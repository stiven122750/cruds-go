name: CI - p-go-delete

on:
  push:
    branches: ["main"]
    paths:
      - "p-go-delete/**"
  pull_request:
    branches: ["main"]
    paths:
      - "p-go-delete/**"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./p-go-delete

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Verify go.mod exists
        run: |
          if [ ! -f "go.mod" ]; then
            echo "ERROR: No go.mod found inside p-go-delete"
            exit 1
          fi

      - name: Tidy modules
        run: go mod tidy

      - name: Run tests
        run: go test ./... -v

      - name: Build
        run: go build -o app-delete
