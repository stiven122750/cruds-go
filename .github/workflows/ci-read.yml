name: CI/CD Read

on:
  push:
    branches: [ "main" ]
    paths:
      - "p-go-read/**"
      - ".github/workflows/ci-read.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "p-go-read/**"
  tags:
    - "v*.*.*"

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: p-go-read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - run: go mod tidy
      - run: go test ./... -v
      - run: go build -o app .

  docker-build-push:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/p-go-read

      - uses: docker/build-push-action@v5
        with:
          context: ./p-go-read
          file: ./p-go-read/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: table
          exit-code: 0
