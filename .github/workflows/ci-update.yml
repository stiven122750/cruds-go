name: CI - p-go-update

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  # Auto-Release cuando se crea un tag v*.*.*
  release:
    types: [published]

jobs:
  #
  # =====================================================
  # TEST + BUILD
  # =====================================================
  #
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./p-go-update

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Verify go.mod exists
        run: |
          if [ ! -f "go.mod" ]; then
            echo "ERROR: No go.mod found inside p-go-update"
            exit 1
          fi

      - name: Tidy modules
        run: go mod tidy

      - name: Run tests
        run: go test ./... -v

      - name: Build binary
        run: go build -o app-update .


  #
  # =====================================================
  #   DOCKER BUILDX + TRIVY + PUSH DOCKERHUB + GHCR
  # =====================================================
  #
  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login DockerHub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # Login GHCR (TOKEN PERSONAL — IGUAL QUE EN LOS OTROS MICROSERVICIOS)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Build + Push to BOTH registries
      - name: Build and Push (DockerHub + GHCR)
        uses: docker/build-push-action@v5
        with:
          context: ./p-go-update
          file: ./p-go-update/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/p-go-update:latest
            ghcr.io/${{ github.repository_owner }}/p-go-update:latest

      # Trivy Security Scan
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          image-ref: ${{ secrets.DOCKER_USER }}/p-go-update:latest
          severity: HIGH,CRITICAL


  #
  # =====================================================
  # AUTO RELEASE WHEN TAG v*.*.*
  # =====================================================
  #
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
