name: CI - p-go-update

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  # Auto Release al crear tags v*.*.*
  release:
    types: [published]

jobs:
  #
  # =====================================================
  # TEST + BUILD
  # =====================================================
  #
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: p-go-update

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Tidy modules
        run: go mod tidy

      - name: Run tests
        run: go test ./... -v

      - name: Build binary
        run: go build -o app-update .


  #
  # =====================================================
  # DOCKER BUILDX + PUSH DOCKERHUB + GHCR + TRIVY
  # =====================================================
  #
  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Login DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # Login GHCR con token clásico
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Metadatos de la imagen
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USER }}/p-go-update
            ghcr.io/${{ github.repository_owner }}/p-go-update

      # Build + Push a AMBOS registries
      - uses: docker/build-push-action@v5
        with:
          context: ./p-go-update
          file: ./p-go-update/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      # Trivy Security Scan
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USER }}/p-go-update:latest
          severity: HIGH,CRITICAL


  #
  # =====================================================
  # AUTO RELEASE WHEN TAG v*.*.*
  # =====================================================
  #
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
