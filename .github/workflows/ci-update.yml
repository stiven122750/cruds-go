name: CI - p-go-update

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  # Auto-Release cuando se crea un tag v*.*.*
  release:
    types: [published]

jobs:
  #
  # =====================================================
  # TEST + BUILD
  # =====================================================
  #
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./p-go-update

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Verify go.mod exists
        run: |
          if [ ! -f "go.mod" ]; then
            echo "ERROR: No go.mod found inside p-go-update"
            exit 1
          fi

      - name: Tidy modules
        run: go mod tidy

      - name: Run tests
        run: go test ./... -v

      - name: Build binary
        run: go build -o app-update .

  #
  # =====================================================
  # INTEGRATION TEST (SIN DOCKER COMPOSE)
  # =====================================================
  #
  integration-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Start fake READ service
        run: |
          cat << 'EOF' > fake_read.go
          package main
          import (
            "encoding/json"
            "net/http"
          )
          func main() {
            http.HandleFunc("/personas/123", func(w http.ResponseWriter, r *http.Request) {
              w.Header().Set("Content-Type", "application/json")
              json.NewEncoder(w).Encode(map[string]string{
                "documento": "123",
              })
            })
            http.ListenAndServe(":5000", nil)
          }
          EOF

          nohup go run fake_read.go >/dev/null 2>&1 &
          sleep 2

      - name: Start UPDATE service
        working-directory: ./p-go-update
        run: |
          nohup go run main.go >/dev/null 2>&1 &
          sleep 3

      - name: Call UPDATE endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT http://localhost:8080/personas/123 \
            -H "Content-Type: application/json" \
            -d '{"nombre":"Nuevo","edad":30}')

          if [ "$STATUS" != "200" ]; then
            echo "Expected 200 but got $STATUS"
            exit 1
          fi

      - name: Validate body
        run: |
          BODY=$(curl -s -X PUT http://localhost:8080/personas/123 \
            -H "Content-Type: application/json" \
            -d '{"nombre":"Nuevo","edad":30}')

          if [ "$BODY" != '{"status":"ok"}' ]; then
            echo "Invalid body: $BODY"
            exit 1
          fi



  #
  # =====================================================
  #   DOCKER BUILDX + TRIVY + PUSH DOCKERHUB + GHCR
  # =====================================================
  #
  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login DockerHub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # Login GHCR (TOKEN PERSONAL — IGUAL QUE EN LOS OTROS MICROSERVICIOS)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Build + Push to BOTH registries
      - name: Build and Push (DockerHub + GHCR)
        uses: docker/build-push-action@v5
        with:
          context: ./p-go-update
          file: ./p-go-update/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/p-go-update:latest
            ghcr.io/${{ github.repository_owner }}/p-go-update:latest

      # Trivy Security Scan
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          image-ref: ${{ secrets.DOCKER_USER }}/p-go-update:latest
          severity: HIGH,CRITICAL


  #
  # =====================================================
  # AUTO RELEASE WHEN TAG v*.*.*
  # =====================================================
  #
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
