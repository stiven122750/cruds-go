name: CI - p-go-delete

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  #
  # ==========================================
  #           JOB: TESTS (unit + integration)
  # ==========================================
  #
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./p-go-delete

    services:
      docker: # Necesario para Testcontainers
        image: docker:24.0-dind
        privileged: true
        options: "--dns 8.8.8.8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Load environment
        run: |
          if [ -f ".env" ]; then
            export $(grep -v '^#' .env | xargs)
            echo "Variables cargadas"
          else
            echo "WARNING: .env no encontrado"
          fi

      - name: Verify go.mod exists
        run: |
          if [ ! -f "go.mod" ]; then
            echo "ERROR: No go.mod found inside p-go-delete"
            exit 1
          fi

      - name: Tidy modules
        run: go mod tidy

      # ============================
      #      UNIT TESTS
      # ============================
      - name: Run UNIT tests
        run: go test ./... -v -count=1

      # ============================
      #   INTEGRATION TESTS
      #   Testcontainers + MongoDB
      # ============================
      - name: Run INTEGRATION tests
        run: |
          echo "Ejecutando pruebas de integración..."
          go test ./... -v -tags=integration -count=1

      # ============================
      #        BUILD BINARY
      # ============================
      - name: Build
        run: go build -o app-delete .

  #
  # =====================================================
  #   DOCKER BUILDX + TRIVY + PUSH DOCKERHUB + GHCR
  # =====================================================
  #
  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ================================
      # LOGIN DOCKER HUB
      # ================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # ================================
      # LOGIN GHCR
      # ================================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # ================================
      # BUILD (UNA VEZ) Y PUSH A AMBOS
      # ================================
      - name: Build and Push (DockerHub + GHCR)
        uses: docker/build-push-action@v5
        with:
          context: ./p-go-delete
          file: ./p-go-delete/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/p-go-delete:latest
            ghcr.io/${{ github.repository_owner }}/p-go-delete:latest

      # ================================
      # TRIVY SCAN
      # ================================
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          image-ref: ${{ secrets.DOCKER_USER }}/p-go-delete:latest
          severity: HIGH,CRITICAL

  #
  # =====================================================
  #   AUTO RELEASE ON TAG v*.*.*
  # =====================================================
  #
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
