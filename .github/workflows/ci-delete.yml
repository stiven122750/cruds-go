name: CI - p-go-delete

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:    # Opcional: ejecutar manualmente

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./p-go-delete

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Load environment
        run: |
          if [ -f ".env" ]; then
            export $(grep -v '^#' .env | xargs)
            echo "Variables cargadas"
          else
            echo "WARNING: .env no encontrado"
          fi

      - name: Verify go.mod exists
        run: |
          if [ ! -f "go.mod" ]; then
            echo "ERROR: No go.mod found inside p-go-delete"
            exit 1
          fi

      - name: Tidy modules
        run: go mod tidy

      - name: Run unit tests
        run: go test ./... -v

      - name: Build
        run: go build -o app-delete .

  #
  # =====================================================
  #   DOCKER BUILDX + TRIVY SECURITY SCAN (ALWAYS RUN)
  # =====================================================
  #
  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build local image (no login, no push)
      - name: Build Docker image (local only)
        uses: docker/build-push-action@v5
        with:
          context: ./p-go-delete
          file: ./p-go-delete/Dockerfile
          push: false
          load: true
          tags: p-go-delete:ci-test

      # Trivy scan
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          image-ref: p-go-delete:ci-test
          severity: HIGH,CRITICAL

