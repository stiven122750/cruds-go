name: CI - p-go-delete

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:

  #
  # ============================================
  #  TESTS: UNIT + INTEGRATION (CON MONGO)
  # ============================================
  #
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./p-go-delete

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: 123456
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # URI para los tests de integración
      MONGO_URI: mongodb://root:123456@localhost:27017/?authSource=admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Verify go.mod exists
        run: |
          if [ ! -f "go.mod" ]; then
            echo "ERROR: go.mod not found"
            exit 1
          fi

      - name: Tidy modules
        run: go mod tidy

      - name: Run unit tests
        run: go test ./... -v -run Test -short

      - name: Run integration tests
        run: go test -tags=integration ./... -v

      - name: Build
        run: go build -o app-delete .

  #
  # ============================================
  #   DOCKER BUILDX + TRIVY + PUSH
  # ============================================
  #
  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push (DockerHub + GHCR)
        uses: docker/build-push-action@v5
        with:
          context: ./p-go-delete
          file: ./p-go-delete/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/p-go-delete:latest
            ghcr.io/${{ github.repository_owner }}/p-go-delete:latest

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKER_USER }}/p-go-delete:latest
          severity: HIGH,CRITICAL


  #
  # ============================================
  #   AUTO RELEASE ON TAG
  # ============================================
  #
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
