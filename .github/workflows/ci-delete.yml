name: CI - p-go-delete

on:
  push:
    branches: ["main"]
    paths:
      - "p-go-delete/**"
  pull_request:
    branches: ["main"]
    paths:
      - "p-go-delete/**"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./p-go-delete

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Load .env variables
        run: |
          export $(grep -v '^#' .env | xargs)
          echo "Variables cargadas"

      - name: Verify go.mod exists
        run: |
          if [ ! -f "go.mod" ]; then
            echo "ERROR: No go.mod found inside p-go-delete"
            exit 1
          fi

      - name: Tidy modules
        run: go mod tidy

      - name: Run unit tests
        run: go test ./... -v

      - name: Build (Go)
        run: go build -o app-delete .

  #
  # =====================================================
  #    BUILD DOCKER IMAGE WITH BUILDX + SCAN WITH TRIVY
  # =====================================================
  #
  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1️⃣ Instalar Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2️⃣ Login a Docker Hub (usa tus secrets)
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # 3️⃣ Buildx Build
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./p-go-delete
          file: ./p-go-delete/Dockerfile
          push: false      # No publicar todavía
          load: true
          tags: |
            ${{ secrets.DOCKER_USER }}/p-go-delete:ci-test

      # 4️⃣ Instalar Trivy
      - name: Install Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          image-ref: ${{ secrets.DOCKER_USER }}/p-go-delete:ci-test
          severity: HIGH,CRITICAL

      #
      # Si quieres publicarlo SOLO si pasa Trivy:
      #
      - name: Push image to Docker Hub (only safe images)
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: ./p-go-delete
          file: ./p-go-delete/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/p-go-delete:latest
